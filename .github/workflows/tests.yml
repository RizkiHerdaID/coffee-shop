name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run test suite
        env:
          PAO_DISABLE: '1'
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit-output.log | tail -40

      - name: Report failure details
        if: failure()
        run: |
          sed 's/^/::error::/' phpunit-output.log | head -80

      - name: Check code style
        run: vendor/bin/pint --test
