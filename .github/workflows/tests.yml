name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        env:
          PAO_DISABLE: '1'
        run: |
          set -o pipefail
          vendor/bin/paratest --no-coverage --processes 4 2>&1 | tee phpunit-output.log | tail -40

      - name: Report failure details
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          t = open('phpunit-output.log', encoding='utf-8', errors='replace').read()
          i = t.find('1) ')
          j = t.find('2) ')
          block = t[i:j if j > 0 else i+1200]
          print('::error::' + block.replace('\n', '%0A')[:2000])
          EOF

      - name: Check code style
        run: vendor/bin/pint --test
