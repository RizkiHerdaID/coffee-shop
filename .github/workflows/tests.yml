name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run test suite
        env:
          PAO_DISABLE: '1'
        run: |
          set -o pipefail
          mkdir -p public/build && printf '{"resources/css/app.css":{"file":"app.css","src":"resources/css/app.css","isEntry":true},"resources/js/app.js":{"file":"app.js","src":"resources/js/app.js","isEntry":true}}' > public/build/manifest.json && printf '{"version":"1","families":{}}' > public/build/fonts-manifest.json
          vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit-output.log | tail -40

      - name: Report failure details
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          t = open('phpunit-output.log', encoding='utf-8', errors='replace').read()
          i = t.find('1) ')
          j = t.find('2) ')
          block = t[i:j if j > 0 else i+1200]
          print('::error::' + block.replace('\n', '%0A')[:2000])
          EOF

      - name: Check code style
        run: vendor/bin/pint --test
