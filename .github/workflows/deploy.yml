name: Deploy coffee-shop

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA to deploy (default: latest main)"
        required: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on production VPS
        env:
          KEY: ${{ secrets.COFFEE_DEPLOY_KEY }}
          HOST: ${{ secrets.COFFEE_DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.COFFEE_DEPLOY_PATH }}
          COMMIT: ${{ github.event.inputs.commit || '' }}
        run: |
          printf '%s\n' "$KEY" > "$HOME/deploy_key"
          chmod 600 "$HOME/deploy_key"
          ssh -i "$HOME/deploy_key" -o StrictHostKeyChecking=accept-new \
            "ubuntu@${HOST}" "sudo bash ${DEPLOY_PATH} '$COMMIT'"
